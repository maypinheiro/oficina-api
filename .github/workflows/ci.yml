name: CI

on:
  push:
    branches: [develop, homolog, main]
  pull_request:
    branches: [develop, homolog, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 22
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/techchallenge_oficina
  JWT_SECRET: ci-secret

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: techchallenge_oficina
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d techchallenge_oficina"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run prisma:migrate:deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run test:integration
        env:
          RUN_INTEGRATION_TESTS: true
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=critical
      - run: docker build --tag oficina-api:${{ github.sha }} .
