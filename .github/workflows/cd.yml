name: Deploy API

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente de destino
        required: true
        type: choice
        options: [hml, prod]

permissions:
  contents: read

concurrency:
  group: oficina-api-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      CLUSTER_NAME: oficina-${{ inputs.environment }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: maypinheiro/oficina-k8s-infra
          ref: ${{ inputs.environment == 'prod' && 'main' || 'homolog' }}
          path: cloud-infra
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
      - name: Authorize this runner on the EKS public endpoint
        shell: bash
        run: |
          RUNNER_CIDR="$(curl --fail --silent --show-error https://checkip.amazonaws.com)/32"
          CURRENT_CIDRS="$(aws eks describe-cluster \
            --name "$CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --query 'cluster.resourcesVpcConfig.publicAccessCidrs' \
            --output json)"
          MERGED_CIDRS="$(jq --compact-output --null-input \
            --argjson current "$CURRENT_CIDRS" \
            --arg runner "$RUNNER_CIDR" \
            '$current + [$runner] | unique')"
          VPC_CONFIG="$(jq --compact-output --null-input \
            --argjson cidrs "$MERGED_CIDRS" \
            '{endpointPublicAccess: true, publicAccessCidrs: $cidrs}')"
          aws eks update-cluster-config \
            --name "$CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --resources-vpc-config "$VPC_CONFIG"
          aws eks wait cluster-active --name "$CLUSTER_NAME" --region "$AWS_REGION"
      - name: Bootstrap authentication secrets
        shell: bash
        run: |
          set -euo pipefail
          ENVIRONMENT="${{ inputs.environment }}"
          ADMIN_SECRET="oficina-${ENVIRONMENT}/api/admin-auth"
          PRIVATE_SECRET="oficina-${ENVIRONMENT}/auth/signing-private"
          PUBLIC_SECRET="oficina-${ENVIRONMENT}/auth/signing-public"
          TEMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TEMP_DIR"' EXIT

          if ! aws secretsmanager describe-secret --secret-id "$ADMIN_SECRET" >/dev/null 2>&1; then
            ADMIN_JWT_SECRET="$(openssl rand -hex 32)"
            jq --null-input --arg value "$ADMIN_JWT_SECRET" '{JWT_SECRET: $value}' \
              > "$TEMP_DIR/admin.json"
            aws secretsmanager create-secret \
              --name "$ADMIN_SECRET" \
              --description "Autenticacao administrativa separada da API Oficina" \
              --secret-string "file://$TEMP_DIR/admin.json" >/dev/null
          fi

          if ! aws secretsmanager describe-secret --secret-id "$PRIVATE_SECRET" >/dev/null 2>&1; then
            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
              -out "$TEMP_DIR/private.pem" 2>/dev/null
            openssl pkey -in "$TEMP_DIR/private.pem" -pubout \
              -out "$TEMP_DIR/public.pem" 2>/dev/null
            KEY_ID="oficina-${ENVIRONMENT}-$(date +%Y%m%d)"
            jq --null-input \
              --rawfile privateKeyPem "$TEMP_DIR/private.pem" \
              --arg keyId "$KEY_ID" \
              '{privateKeyPem: $privateKeyPem, keyId: $keyId}' \
              > "$TEMP_DIR/private.json"
            PUBLIC_KEY_BASE64="$(base64 -w 0 "$TEMP_DIR/public.pem")"
            jq --null-input --arg value "$PUBLIC_KEY_BASE64" \
              '{JWT_PUBLIC_KEY_BASE64: $value}' > "$TEMP_DIR/public.json"
            aws secretsmanager create-secret \
              --name "$PRIVATE_SECRET" \
              --description "Chave privada RSA da autenticacao de clientes" \
              --secret-string "file://$TEMP_DIR/private.json" >/dev/null
            aws secretsmanager create-secret \
              --name "$PUBLIC_SECRET" \
              --description "Chave publica RSA consumida pela API" \
              --secret-string "file://$TEMP_DIR/public.json" >/dev/null
          fi
      - name: Build and push immutable image
        run: |
          IMAGE_URI=${{ steps.ecr.outputs.registry }}/oficina-api:${IMAGE_TAG}
          docker build --tag "$IMAGE_URI" .
          docker push "$IMAGE_URI"
      - name: Configure cluster and render manifests
        run: |
          aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"
          sed -i "s/oficina-env/oficina-${{ inputs.environment }}/g; s/ENVIRONMENT/${{ inputs.environment }}/g; s/IMAGE_TAG/${IMAGE_TAG}/g; s|CORS_ORIGIN: \"CORS_ORIGIN\"|CORS_ORIGIN: \"${{ vars.CORS_ORIGIN }}\"|g" cloud-infra/k8s/*.yaml
      - name: Run controlled migration
        shell: bash
        run: |
          kubectl apply -f cloud-infra/k8s/namespace.yaml
          kubectl apply -f cloud-infra/k8s/configmap.yaml -f cloud-infra/k8s/secret.yaml
          if ! kubectl wait --for=condition=Ready \
            externalsecret/oficina-api-secrets \
            -n "oficina-${{ inputs.environment }}" --timeout=2m; then
            kubectl describe clustersecretstore/aws-secrets-manager
            kubectl describe externalsecret/oficina-api-secrets -n "oficina-${{ inputs.environment }}"
            exit 1
          fi
          kubectl delete job prisma-migrate -n "oficina-${{ inputs.environment }}" --ignore-not-found
          kubectl apply -f cloud-infra/k8s/prisma-job.yaml
          if ! kubectl wait --for=condition=complete job/prisma-migrate \
            -n "oficina-${{ inputs.environment }}" --timeout=5m; then
            kubectl get pods -n "oficina-${{ inputs.environment }}" -o wide
            kubectl describe job/prisma-migrate -n "oficina-${{ inputs.environment }}"
            kubectl logs job/prisma-migrate -n "oficina-${{ inputs.environment }}" --all-containers --tail=200 || true
            exit 1
          fi
      - name: Deploy and verify rollout
        run: |
          kubectl apply -f cloud-infra/k8s/api.yaml -f cloud-infra/k8s/api-pdb.yaml -f cloud-infra/k8s/hpa.yaml
          kubectl rollout status deployment/oficina-api -n "oficina-${{ inputs.environment }}" --timeout=5m
          kubectl get deployment,pods,hpa -n "oficina-${{ inputs.environment }}" -o wide
      - name: Smoke test through port-forward
        run: |
          kubectl port-forward -n "oficina-${{ inputs.environment }}" service/oficina-api 8080:80 >/tmp/port-forward.log 2>&1 &
          for attempt in {1..12}; do curl --fail http://127.0.0.1:8080/health && exit 0; sleep 5; done
          cat /tmp/port-forward.log
          exit 1
