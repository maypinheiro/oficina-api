services:
  app:
    build:
      context: .
    container_name: techchallenge-oficina-api
    command: sh -c "npm run prisma:migrate:deploy && npm run db:seed:ts && npm run start"
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/techchallenge_oficina
      JWT_SECRET: local-dev-secret
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    container_name: techchallenge-oficina-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: techchallenge_oficina
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - techchallenge_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d techchallenge_oficina"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  techchallenge_postgres_data:
