sonar.projectKey=oficina-api
sonar.projectName=Oficina API
sonar.projectVersion=0.1.0

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.spec.ts,src/integration/**/*.ts
sonar.exclusions=src/main.ts,src/presentation/http/swagger.ts,src/presentation/http/routes/**/*.ts,src/contexts/**/infra/**/*.ts

sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPath=tsconfig.json
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.scm.disabled=true

sonar.coverage.exclusions=src/main.ts,src/presentation/http/swagger.ts,src/presentation/http/routes/**/*.ts,src/contexts/**/infra/**/*.ts,src/**/*.spec.ts,src/integration/**/*.ts
